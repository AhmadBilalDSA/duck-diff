[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duck-diff"
version = "1.0.0"
description = "Fast, constant-memory data diffing across Parquet, CSV, TSV, JSON, Arrow and SQLite — powered by an embedded DuckDB SQL engine, with a turnkey GitHub Action for data-platform CI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "duck-diff contributors" }]
keywords = [
    "data",
    "diff",
    "data-quality",
    "duckdb",
    "parquet",
    "csv",
    "schema-drift",
    "ci",
    "github-action",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "duckdb>=0.10.0",
]

[project.optional-dependencies]
ui = ["rich>=13.0.0", "typer>=0.12.0"]
dev = ["pytest>=7.0.0", "rich>=13.0.0", "typer>=0.12.0"]

[project.scripts]
duck-diff = "duck_diff.cli:main"

[project.urls]
Homepage = "https://github.com/duck-diff/duck-diff"
Documentation = "https://github.com/duck-diff/duck-diff#readme"
Issues = "https://github.com/duck-diff/duck-diff/issues"

[tool.setuptools.packages.find]
include = ["duck_diff*"]

[tool.setuptools.package-data]
duck_diff = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
