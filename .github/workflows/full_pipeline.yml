name: Full PR-to-LinkedIn Pipeline

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:
    inputs:
      auto_publish:
        description: 'Auto-publish the generated post to LinkedIn'
        required: true
        type: boolean
        default: false

jobs:
  full_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests matplotlib
      - name: Run Full PR-to-LinkedIn Pipeline
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          AUTO_PUBLISH: ${{ inputs.auto_publish && 'true' || 'false' }}
        run: python scripts/full_pipeline.py